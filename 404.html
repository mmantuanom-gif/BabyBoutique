<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>404 - Página no encontrada | BABYBOUTIQUE</title>
  <style>
    :root {
      --primary: #1f5f3d;
      --primary-dark: #153f2b;
      --accent: #7dd3a2;
      --text: #1f2937;
      --light: #f8faf9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #f3fff7 0%, #eaf8ef 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 45px rgba(31, 95, 61, 0.16);
      max-width: 720px;
      width: 100%;
      padding: 48px 32px;
      text-align: center;
      border: 1px solid #e3f1e8;
    }

    .code {
      font-size: 5rem;
      font-weight: 800;
      color: var(--primary);
      margin: 0 0 12px;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 2rem;
      margin: 0 0 12px;
      color: var(--primary-dark);
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #4b5563;
      margin: 0 0 24px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 10px 20px rgba(31, 95, 61, 0.2);
    }

    .btn-secondary {
      background: var(--light);
      color: var(--primary-dark);
      border: 1px solid #d8e9de;
    }

    @media (max-width: 600px) {
      .card { padding: 32px 20px; }
      .code { font-size: 3.5rem; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>Página no encontrada</h1>
    <p>La ruta que buscas no existe o fue movida. Regresa al catálogo.</p>
    <div class="actions">
      <a class="btn btn-primary" href="index.html">Volver al inicio</a>
      <a class="btn btn-secondary" href="index.html#productos">Ver productos</a>
    </div>
  </main>
</body>
</html>
